name: "[PUSH] Create Package"
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "force-app/**"
jobs:
  create-package:
    name: Run Package Creation
    uses: navikt/crm-workflows-base/.github/workflows/packageCreate.yml@master
    permissions:
      contents: write
    secrets: inherit

  install-in-uat:
    name: Install in UAT
    needs: [create-package]
    # TEMPORARY: Preserve TOLK-3472 metadata in UAT.
    # Change back to @master when TOLK-3472 is merged.
    uses: navikt/crm-workflows-base/.github/workflows/deployPackage.yml@TOLK-3472-deprecate-only
    permissions:
      contents: read
    with:
      packageId: ${{ needs.create-package.outputs.packageId }}
      org: uat
      unpackagable: ./force-app/unpackagable-with-auto-deploy
    secrets: inherit
