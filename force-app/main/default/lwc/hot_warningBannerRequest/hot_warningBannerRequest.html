<template>
    <template if:true={hasSecurityMeasures}>
        <c-hot_universal-alert-banner type="Error" style="display: block">
            <div style="display: inline-flex">
                <div style="display: block">
                    Det er følgende sikkerhetstiltak på brukeren:
                    <template for:each={securityMeasures} for:item="sm">
                        <p key={sm}>{sm}</p>
                    </template>
                </div>
            </div>
        </c-hot_universal-alert-banner>
    </template>
    <template if:true={hasReservations}>
        <c-hot_universal-alert-banner type="Error" show-icon >
            <h2 class="slds-text-heading_small">Det er følgende reservasjoner på brukeren: {reservations}</h2>
        </c-hot_universal-alert-banner>
    </template>
    <template if:true={hasDuplicates}>
        <c-hot_universal-alert-banner 
            type="Warning" 
            show-icon 
            message="Brukeren har allerede forespørsler i dette tidsrommet."
            items={duplicateItems}
        ></c-hot_universal-alert-banner>
    </template>
    <template if:true={hasSelfDuplicates}>
        <c-hot_universal-alert-banner type="Warning" show-icon>
            <span>Denne forespørselen har overlappende arbeidsordrer.</span>
        </c-hot_universal-alert-banner>
    </template>
    <template if:true={isDeceased}>
        <c-hot_universal-alert-banner 
            type="Error" 
            show-icon 
            message="Denne brukeren er død."
        ></c-hot_universal-alert-banner>
    </template>
    <template if:true={showNameMismatchWarning}>
        <c-hot_universal-alert-banner 
            type="Warning" 
            show-icon
            message="Navnet som er oppgitt av bestiller stemmer muligens ikke overens med personen fødselsnummeret eller mobilnummeret tilhører.Vennligst dobbeltsjekk dette."
        ></c-hot_universal-alert-banner>
    </template>
</template>
