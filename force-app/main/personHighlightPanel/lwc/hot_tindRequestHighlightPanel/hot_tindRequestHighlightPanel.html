<template>
    <template lwc:if={errorMessages}>
        <template iterator:it={errorMessages}>
            <div class="errorPanel highlightPanel" key={it.value.errorName}>
                <div class="warningIcon">
                    <c-hot_tind-custom-svg src={warningIconSrc} alt-text="warning"></c-hot_tind-custom-svg>
                </div>
                <p>{it.value.error}</p>
                <div class="xMarkIcon" data-error-name={it.value.errorName} onclick={closeErrorMessage}>
                    <c-hot_tind-custom-svg src={xMarkIconSrc} alt-text="close"></c-hot_tind-custom-svg>
                </div>
            </div>
            <div lwc:if={it.last} key={it.value.errorName}></div>
            <div lwc:else key={it.value.errorName} class="errorBorder"></div>
        </template>
    </template>
    <div class="requestBackground">
        <template lwc:if={isLoading}>
            <c-hot_tind-skeleton-loading-component></c-hot_tind-skeleton-loading-component>
        </template>
        <template lwc:else>
            <lightning-layout class="panelBackground">
                <div class="highlightPanel">
                    <lightning-layout-item class="highlightPanelTop nowrap-selector">
                        <lightning-layout-item>
                            <c-hot_tind-request-highlight-panel-top
                                record-id={recordId}
                                request-details={requestData}
                            ></c-hot_tind-request-highlight-panel-top>
                        </lightning-layout-item>
                    </lightning-layout-item>

                    <lightning-layout-item>
                        <c-hot_tind-request-highlight-panel-bot
                            record-id={recordId}
                            request-details={requestData}
                            onrefreshrequest={handleRefreshRequest}
                        ></c-hot_tind-request-highlight-panel-bot>
                    </lightning-layout-item>
                </div>
            </lightning-layout>
        </template>
    </div>
</template>
