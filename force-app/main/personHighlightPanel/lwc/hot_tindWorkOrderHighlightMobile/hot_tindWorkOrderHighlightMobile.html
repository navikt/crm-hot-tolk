<template>
    <div class="panelWrapper">
        <div class="panelHeader">
            <template lwc:if={isLoading}>
                <lightning-spinner
                    size="small"
                    alternative-text="Laster oppdragsinformasjon"
                    variant="inverse"
                ></lightning-spinner>
            </template>
            <template lwc:else>
                <lightning-icon
                    icon-name="standard:work_order"
                    size="medium"
                    class="headerIcon"
                    alternative-text="Oppdrag"
                ></lightning-icon>
                <div class="headerText">
                    <span class="headerTitle">{workOrderNumber}</span>
                    <span class="headerName">{accountName}</span>
                    <span lwc:if={hasInfo} class="detailsLine">{detailsLine}</span>
                </div>
            </template>
        </div>
        <template lwc:if={error}>
            <div class="errorState">Kunne ikke hente oppdragsinformasjon.</div>
        </template>
        <template lwc:elseif={hasNoData}>
            <div class="errorState">Fant ikke tilknyttet oppdrag for denne avtalen.</div>
        </template>
    </div>
</template>
