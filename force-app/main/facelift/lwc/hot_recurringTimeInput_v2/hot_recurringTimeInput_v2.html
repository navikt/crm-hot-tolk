<template>
    <div style="margin-bottom: 0.5rem">
        <template iterator:it={timesWithDeleteLabels}>
            <div key={it.value.id} class="listClass">
                <h2 class="sr-only">
                    Dato: {it.value.date}. Tid: {it.value.startTimeString} - {it.value.endTimeString}
                </h2>
                <c-input
                    label="Dato"
                    data-id="date"
                    type="date"
                    ongetvalueonchange={handleDateChange}
                    name={it.value.id}
                    value={it.value.date}
                    error-text="Feltet må fylles ut."
                    style={dateTimeDesktopStyle}
                    mobile-style="padding-bottom: 1vw; --c-input-date-min-height: 44px;"
                ></c-input>
                <c-input
                    label="Starttid"
                    data-id="startTime"
                    type="time"
                    value={it.value.startTimeString}
                    error-text="Feltet må fylles ut."
                    name={it.value.id}
                    ongetvalueonchange={handleStartTimeChange}
                    desktop-style="padding-left: 1vw"
                    mobile-style="padding-bottom: 1vw; --c-input-time-min-height: 44px;"
                    style={dateTimeDesktopStyle}
                ></c-input>
                <c-input
                    label="Sluttid"
                    data-id="endTime"
                    type="time"
                    value={it.value.endTimeString}
                    error-text="Feltet må fylles ut."
                    name={it.value.id}
                    ongetvalueonchange={handleEndTimeChange}
                    desktop-style="padding-left: 1vw"
                    mobile-style="--c-input-time-min-height: 44px;"
                    style={dateTimeDesktopStyle}
                ></c-input>
                <br if:false={isOnlyOneTime} />
                <div style="padding-top: 4.5%; padding-left: 1vw">
                    <c-button
                        if:false={isOnlyOneTime}
                        data-id="removeTime"
                        type="button"
                        button-styling="danger"
                        onbuttonclick={removeTime}
                        aria-label={it.value.deleteLabel}
                        name={it.value.id}
                        button-label="Slett"
                    >
                    </c-button>
                </div>
                <br if:false={isOnlyOneTime} />
            </div>
        </template>

        <template lwc:if={hideGjentagende}>
            <!-- Show nothing -->
        </template>
        <template lwc:else>
            <c-checkbox
                label="Gjentagende"
                oncheckboxclick={advancedTimes}
                name="Gjentagende"
                aria-label="Gjentagende bestilling?"
            ></c-checkbox>
            <div
                if:true={isAdvancedTimes}
                class="time-inputs-container"
                style="margin-bottom: 0.5rem"
                aria-live="polite"
            >
                <c-picklist
                    name="Gjenta"
                    choices={repeatingOptions}
                    onpicklistvaluechange={handleRepeatChoiceMade}
                    master-label="Gjenta"
                    desktop-style="width: 30%"
                    mobile-style="width: 100%"
                    data-id="recurringType"
                >
                </c-picklist>
                <br />
                <div lwc:if={showWeekDays} aria-live="polite">
                    <c-checkboxgroup
                        data-id="recurringDays"
                        checkboxes={days}
                        oncheckboxgroupclick={handleDayChosen}
                        header="Ukedager"
                        error-text="Du må velge minst én dag tolkebehovet gjentas."
                    ></c-checkboxgroup>
                </div>
                <div aria-live="polite" if:true={isRepeating}>
                    <c-input
                        label="Sluttdato"
                        data-id="recurringEndDate"
                        type="date"
                        ongetvalueonchange={setRepeatingEndDateDate}
                        name="recurring End Date"
                        value={repeatingEndDateString}
                        error-text="Feltet må fylles ut."
                        desktop-style="width: 30%"
                    ></c-input>
                </div>
                <div lwc:if={recurringDateError} class="recurring-date-error" role="alert">{recurringDateError}</div>
                <p lwc:if={previewLoading} role="status">Henter forhåndsvisning...</p>
                <template lwc:elseif={previewValidationError}>
                    <div class="recurring-date-error" role="alert">{previewValidationError}</div>
                    <c-button
                        lwc:if={previewError}
                        type="button"
                        button-styling="secondary"
                        button-label="Prøv igjen"
                        onbuttonclick={refreshRecurringPreview}
                    ></c-button>
                </template>
                <div lwc:if={hasPreviewIntervals} class="recurring-preview">
                    <h3 class="recurring-preview-heading">Forhåndsvisning av tidspunkter</h3>
                    <p class="recurring-preview-count" role="status">{previewCountLabel}</p>
                    <dl class="recurring-preview-dates">
                        <div>
                            <dt>Første tidspunkt:</dt>
                            <dd>{previewFirstDate}</dd>
                        </div>
                        <div>
                            <dt>Siste tidspunkt:</dt>
                            <dd>{previewLastDate}</dd>
                        </div>
                    </dl>
                    <p lwc:if={recurringBoundaryWarning} class="recurring-boundary-warning">
                        {recurringBoundaryWarning}
                    </p>
                    <details ontoggle={handlePreviewToggle}>
                        <summary>
                            <span class="recurring-preview-chevron" aria-hidden="true"></span>
                            <span>{previewToggleLabel}</span>
                        </summary>
                        <div class="recurring-preview-list">
                            <table>
                                <caption class="sr-only">
                                    Tidspunkter i serien
                                </caption>
                                <thead>
                                    <tr>
                                        <th scope="col">Dato</th>
                                        <th scope="col">Fra</th>
                                        <th scope="col">Til</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={previewIntervals} for:item="interval">
                                        <tr key={interval.startTime}>
                                            <td>{interval.dateLabel}</td>
                                            <td>{interval.startLabel}</td>
                                            <td>{interval.endLabel}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </details>
                    <p lwc:if={showPreviewTimeZoneNotice} class="recurring-preview-timezone">
                        Alle datoer og klokkeslett i forhåndsvisningen er oppgitt i norsk tid.
                    </p>
                    <p class="recurring-preview-hint">Kontroller datoene og klokkeslettene før du sender inn.</p>
                </div>
            </div>
        </template>
        <c-button
            if:false={isAdvancedTimes}
            data-id="addTime"
            type="button"
            button-styling="secondary"
            onbuttonclick={addTime}
            aria-label="Legg til flere tider"
            button-label="+ Legg til flere tider"
        >
        </c-button>
    </div>
</template>
