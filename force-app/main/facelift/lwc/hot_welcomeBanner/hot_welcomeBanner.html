<template>
    <div class="banner">
        <div class="banner-left">
            <template lwc:if={isChristmasSeason}>
                <img class="logo" src={logoUrl} alt="Tolketjenesten" />
            </template>
            <template lwc:elseif={isNotMobilePublisher}>
                <h1>Tolketjenesten</h1>
            </template>
            <template lwc:else>
                <h1>Hei, {personFirstName}</h1>
            </template>
            <c-hot_notification-list-viewer></c-hot_notification-list-viewer>
            <c-hot_announcement-list-viewer
                announcements={announcements}
                unread-announcement-ids={unreadAnnouncementIds}
            ></c-hot_announcement-list-viewer>
        </div>

        <div class="banner-right"></div>
    </div>
</template>
