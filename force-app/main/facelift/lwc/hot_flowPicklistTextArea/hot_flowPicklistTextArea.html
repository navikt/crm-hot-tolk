<template>
    <div class="main-container">
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12" padding="around-small">
                <c-picklist
                    master-label={labelValue}
                    choices={options}
                    onpicklistvaluechange={handlePicklistChange}
                    set-default-value={value}
                    error-text={errorMessagePicklist}
                >
                </c-picklist>
            </lightning-layout-item>
            <lightning-layout-item size="12" padding="around-small">
                <c-textarea
                    label={textareaLabelValue}
                    maxlength="255"
                    value={inputText}
                    error-text={errorMessageTextarea}
                    ongetvalueontextareachange={handleTextareaChange}
                >
                </c-textarea>
            </lightning-layout-item>
        </lightning-layout>
    </div>

    <div class="button-container">
        <c-button
            type="Button"
            onbuttonclick={handleBack}
            button-label="Forrige"
            button-styling="Secondary"
            aria-label="Forrige"
            desktop-style="width: 5rem; justify-content: center; margin-right: 0.5rem;"
            mobile-style="justify-content: center; margin-right: 0.5rem;"
        ></c-button>

        <c-button
            type="Button"
            onbuttonclick={handleNext}
            button-label="Neste"
            button-styling="Primary"
            aria-label="Neste"
            desktop-style="width: 5rem; justify-content: center;"
            mobile-style="justify-content: center;"
        ></c-button>
    </div>
</template>
