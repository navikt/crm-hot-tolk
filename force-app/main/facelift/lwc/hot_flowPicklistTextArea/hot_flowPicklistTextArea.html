<template>
    <div class="main-container">
        <lightning-combobox
            class="custom-combobox"
            label={label}
            value={value}
            placeholder="Velg et alternativ"
            options={options}
            onchange={handlePicklistChange}
        >
        </lightning-combobox>

        <template if:true={errorMessagePicklist}>
            <div class="error-message">{errorMessagePicklist}</div>
        </template>

        <c-textarea
            name="textarea"
            maxlength="255"
            label={textareaLabel}
            value={inputText}
            error-text={errorMessageTextarea}
            ongetvalueontextareachange={handleTextareaChange}
        >
        </c-textarea>

        <template if:true={errorMessageTextarea}>
            <div class="error-message" aria-live="polite">{errorMessageTextarea}</div>
        </template>
    </div>

    <div class="button-container">
        <c-button
            type="Button"
            onbuttonclick={handleBack}
            button-label="Forrige"
            button-styling="Secondary"
            aria-label="Forrige"
            desktop-style="width: 5rem; justify-content: center; margin-right: 0.5rem;"
            mobile-style="justify-content: center; margin-right: 0.5rem;"
        ></c-button>

        <c-button
            type="Button"
            onbuttonclick={handleNext}
            button-label="Neste"
            button-styling="Primary"
            aria-label="Neste"
            desktop-style="width: 5rem; justify-content: center;"
            mobile-style="justify-content: center;"
        ></c-button>
    </div>
</template>
