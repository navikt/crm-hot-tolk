<template>
    <div class="main-content">
        <label class="picklist-label" for="flow-picklist">{label}</label>
        <lightning-combobox
            id="flow-picklist"
            label={label}
            variant="label-hidden"
            value={value}
            placeholder="Velg et alternativ"
            options={options}
            required={required}
            onchange={handleChange}
        ></lightning-combobox>

        <template if:true={errorMessage}>
            <div class="error-message">{errorMessage}</div>
        </template>
    </div>
    <template lwc:if={showNavButtons}>
        <div class="button-container">
            <c-button
                type="Button"
                onbuttonclick={handleBack}
                button-label="Forrige"
                button-styling="Secondary"
                aria-label="Forrige"
                desktop-style="width: 5rem; justify-content: center; margin-right: 0.5rem;"
                mobile-style="justify-content: center; margin-right: 0.5rem;"
            ></c-button>

            <c-button
                type="Button"
                onbuttonclick={handleNext}
                button-label="Neste"
                button-styling="Primary"
                aria-label="Neste"
                desktop-style="width: 5rem; justify-content: center;"
                mobile-style="justify-content: center;"
            ></c-button>
        </div>
    </template>
</template>
