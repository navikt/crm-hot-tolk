<template>
    <template lwc:if={showBulkReview}>
        <c-hot_tjenesteleverandor-bulk-acceptance
            appointments={bulkReviewRecords}
            action={bulkAction}
            oncancel={handleCancelBulkReview}
            onresponsecomplete={handleBulkResponseComplete}
        ></c-hot_tjenesteleverandor-bulk-acceptance>
    </template>

    <template lwc:else>
        <template lwc:if={bulkFeedback}>
            <div class={bulkFeedback.className} role={bulkFeedback.role} aria-live="polite">
                <lightning-icon
                    icon-name={bulkFeedback.icon}
                    alternative-text=""
                    size="x-small"
                    variant="inverse"
                    class="slds-m-right_x-small"
                ></lightning-icon>
                <p>{bulkFeedback.message}</p>
            </div>
        </template>

        <template lwc:if={hasResult}>
            <div class="bulk-action-bar">
                <p aria-live="polite">{selectedAppointmentsLabel}</p>
                <div class="bulk-action-buttons">
                    <template lwc:if={canShowBulkDecline}>
                        <c-button
                            data-id="start-bulk-decline"
                            button-styling="danger"
                            button-label={bulkDeclineButtonLabel}
                            aria-label={bulkDeclineButtonAriaLabel}
                            disabled={isBulkResponseDisabled}
                            onbuttonclick={handleStartBulkDeclineReview}
                        ></c-button>
                    </template>
                    <template lwc:if={canShowBulkAcceptance}>
                        <c-button
                            data-id="start-bulk-acceptance"
                            button-styling="primary"
                            button-label={bulkAcceptButtonLabel}
                            aria-label={bulkAcceptButtonAriaLabel}
                            disabled={isBulkResponseDisabled}
                            onbuttonclick={handleStartBulkAcceptReview}
                        ></c-button>
                    </template>
                </div>
            </div>
            <div class="main-content">
                <c-hot_freelance-common-table
                    records={records}
                    columns={columns}
                    onrowclick={goToRecordDetails}
                    checkbox="true"
                    checked-rows={checkedServiceAppointments}
                    oncheckedrows={handleRowChecked}
                >
                </c-hot_freelance-common-table>
            </div>
        </template>

        <template lwc:if={noServiceAppointmentsResult}>
            <div style="text-align: center" aria-live="polite">
                <br />
                <p>Det finnes ingen overførte oppdrag til tjenesteleverandør.</p>
                <br />
            </div>
        </template>

        <!-- MODAL -->
        <dialog class="modal-container" aria-label="Informasjon om oppdrag" aria-modal="true" onclose={closeModal}>
            <template lwc:if={showServiceAppointmentDetailsModal}>
                <div>
                    <div class="modal-header">
                        <h2>Informasjon om oppdraget:</h2>
                        <button class="close-btn" onclick={closeModal} aria-label="Lukk">
                            <img src={exitCrossIcon} alt="" aria-hidden="true" />
                        </button>
                    </div>
                    <template lwc:if={serviceAppointment}>
                        <div class="modal-body">
                            <p>
                                <strong>Oppdragsnummer:</strong>
                                {serviceAppointment.HOT_ServiceAppointmentNumber__c}
                            </p>
                            <p><strong>Tema:</strong> {serviceAppointment.HOT_FreelanceSubject__c}</p>
                            <p>
                                <strong>Tid:</strong> {serviceAppointment.weekday} {serviceAppointment.StartAndEndDate}
                            </p>
                            <p><strong>Adresse:</strong> {serviceAppointment.HOT_AddressFormated__c}</p>
                            <p><strong>Tolkemetode:</strong> {serviceAppointment.HOT_WorkTypeName__c}</p>
                            <template lwc:if={serviceAppointment.HOT_PreparationTime__c}>
                                <p>
                                    <strong>Kompensert forberedelse:</strong>
                                    {serviceAppointment.HOT_PreparationTime__c}
                                </p>
                            </template>
                            <p><strong>Oppdragstype:</strong> {serviceAppointment.HOT_AssignmentType__c}</p>
                            <p><strong>Frigitt av:</strong> {serviceAppointment.HOT_ReleasedBy__c}</p>
                            <p><strong>Frigitt dato:</strong> {serviceAppointment.ReleaseDate}</p>
                            <p>
                                <strong>Antall påmeldte:</strong>
                                {serviceAppointment.HOT_NumberOfInterestedResources__c}
                            </p>
                            <p><strong>Annen betaler:</strong> {serviceAppointment.isOtherProvider}</p>
                            <p><strong>Region:</strong> {serviceAppointment.HOT_ServiceTerritoryName__c}</p>
                            <p><strong>Frist dato:</strong> {serviceAppointment.HOT_DeadlineDate__c}</p>
                            <template lwc:if={serviceAppointment.HOT_TjenesteleverandorTransferDate__c}>
                                <p>
                                    <strong>Overført tidspunkt:</strong>
                                    &nbsp;{serviceAppointment.HOT_TjenesteleverandorTransferDate__c}
                                </p>
                            </template>

                            <!-- Serviceappointment series -->
                            <template lwc:if={isSeries}>
                                <div class="series-container">
                                    <c-hot_freelance-common-table
                                        records={seriesRecords}
                                        columns={inDetailsColumns}
                                        onrowclick={goToRecordDetails}
                                    ></c-hot_freelance-common-table>
                                </div>
                            </template>
                        </div>
                        <div class="modal-footer">
                            <c-button
                                button-styling="primary"
                                button-label="Vis mer info"
                                aria-label="Vis mer informasjon om oppdraget"
                                title="Vis mer info om oppdraget"
                                onbuttonclick={handleViewMoreInfo}
                            ></c-button>
                        </div>
                    </template>
                </div>
            </template>
        </dialog>

        <template lwc:if={dataLoader}>
            <div class="loader-container">
                <c-hot_loader size="3xlarge"></c-hot_loader>
            </div>
        </template>
    </template>
</template>
