<template>
    <template lwc:if={hasResult}>
        <div class="main-content">
            <c-hot_freelance-common-table records={records} columns={columns} onrowclick={goToRecordDetails}>
            </c-hot_freelance-common-table>
        </div>
    </template>

    <template lwc:elseif={noServiceAppointmentsResult}>
        <div style="text-align: center" aria-live="polite">
            <br />
            <p>Det finnes ingen aksepterte oppdrag til tjenesteleverandør.</p>
            <br />
        </div>
    </template>

    <template lwc:elseif={noFilteredRecordsResult}>
        <div class="empty-state" aria-live="polite">
            <p>Det finnes ingen oppdrag med denne filtreringen. Du kan endre filteret for å se andre oppdrag.</p>
        </div>
    </template>

    <!-- MODAL -->
    <dialog class="modal-container" aria-label="Informasjon om oppdrag" aria-modal="true" onclose={closeModal}>
        <template lwc:if={showServiceAppointmentDetailsModal}>
            <div>
                <div class="modal-header">
                    <h2>Informasjon om oppdraget:</h2>
                    <button class="close-btn" onclick={closeModal} aria-label="Lukk">
                        <img src={exitCrossIcon} alt="" aria-hidden="true" />
                    </button>
                </div>
                <template lwc:if={serviceAppointment}>
                    <div class="modal-body">
                        <p><strong>Oppdragsnummer:</strong> {serviceAppointment.HOT_ServiceAppointmentNumber__c}</p>
                        <p><strong>Tema:</strong> {serviceAppointment.HOT_FreelanceSubject__c}</p>
                        <p><strong>Tid:</strong> {serviceAppointment.weekday} {serviceAppointment.StartAndEndDate}</p>
                        <p><strong>Adresse:</strong> {serviceAppointment.HOT_AddressFormated__c}</p>
                        <p><strong>Tolkemetode:</strong> {serviceAppointment.HOT_WorkTypeName__c}</p>
                        <template lwc:if={serviceAppointment.HOT_PreparationTime__c}>
                            <p>
                                <strong>Kompensert forberedelse:</strong>
                                {serviceAppointment.HOT_PreparationTime__c}
                            </p>
                        </template>
                        <p><strong>Oppdragstype:</strong> {serviceAppointment.HOT_AssignmentType__c}</p>
                        <p><strong>Status:</strong> {status}</p>
                        <p><strong>Frigitt av:</strong> {serviceAppointment.HOT_ReleasedBy__c}</p>
                        <p><strong>Frigitt dato:</strong> {serviceAppointment.ReleaseDate}</p>
                        <p><strong>Frist dato:</strong> {serviceAppointment.HOT_DeadlineDate__c}</p>
                        <p>
                            <strong>Antall påmeldte:</strong>
                            {serviceAppointment.HOT_NumberOfInterestedResources__c}
                        </p>
                        <p><strong>Annen betaler:</strong> {serviceAppointment.isOtherProvider}</p>
                        <p><strong>Region:</strong> {serviceAppointment.HOT_ServiceTerritoryName__c}</p>
                    </div>

                    <div class="thread-card-nav">
                        <c-hot_expansion-card>
                            <span slot="title">Samtale med Nav</span>
                            <div slot="description">
                                <template lwc:if={hasNavTLThread}>
                                    <div class="thread-participants">
                                        <span class="thread-participants-label">Deltakere:</span>
                                        <template for:each={navTLParticipants} for:item="participant">
                                            <c-hot_tag
                                                key={participant.id}
                                                label={participant.label}
                                                variant="moderate"
                                                size="small"
                                                color="info"
                                            ></c-hot_tag>
                                        </template>
                                    </div>
                                    <div class="thread-readers">
                                        <span class="thread-readers-label">Lest av:</span>
                                        <template lwc:if={hasNavTLReadParticipants}>
                                            <template for:each={navTLReadParticipants} for:item="participant">
                                                <c-hot_tag
                                                    key={participant.id}
                                                    label={participant.label}
                                                    variant="moderate"
                                                    size="small"
                                                    color="success"
                                                ></c-hot_tag>
                                            </template>
                                        </template>
                                        <template lwc:else>
                                            <c-hot_tag
                                                label="Ingen"
                                                variant="moderate"
                                                size="small"
                                                color="warning"
                                            ></c-hot_tag>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <c-hot_tag
                                        label="Samtale er ikke opprettet"
                                        variant="moderate"
                                        size="small"
                                        color="warning"
                                    ></c-hot_tag>
                                </template>
                            </div>

                            <template lwc:if={hasNavTLThread}>
                                <c-hot_messaging-thread-viewer
                                    thread={navTLThread}
                                    set-input-in-focus-on-render
                                    is-tjeneste-leverandor-formidler-view
                                ></c-hot_messaging-thread-viewer>
                            </template>
                            <template lwc:else>
                                <c-hot_messaging-thread-viewer-mock
                                    set-input-in-focus-on-render
                                    initial-message={navTLInitialMessage}
                                    data-user-thread-mock
                                    oncreatethreadwithmessage={handleCreateNavTLThreadWithMessage}
                                ></c-hot_messaging-thread-viewer-mock>
                            </template>
                        </c-hot_expansion-card>
                    </div>

                    <div class="thread-card-tolk">
                        <c-hot_expansion-card>
                            <span slot="title">Samtale med tolk</span>
                            <div slot="description">
                                <template lwc:if={hasTolkTLThread}>
                                    <div class="thread-participants">
                                        <span class="thread-participants-label">Deltakere:</span>
                                        <template for:each={tolkTLParticipants} for:item="participant">
                                            <c-hot_tag
                                                key={participant.id}
                                                label={participant.label}
                                                variant="moderate"
                                                size="small"
                                                color="info"
                                            ></c-hot_tag>
                                        </template>
                                    </div>
                                    <div class="thread-readers">
                                        <span class="thread-readers-label">Lest av:</span>
                                        <template lwc:if={hasTolkTLReadParticipants}>
                                            <template for:each={tolkTLReadParticipants} for:item="participant">
                                                <c-hot_tag
                                                    key={participant.id}
                                                    label={participant.label}
                                                    variant="moderate"
                                                    size="small"
                                                    color="success"
                                                ></c-hot_tag>
                                            </template>
                                        </template>
                                        <template lwc:else>
                                            <c-hot_tag
                                                label="Ingen"
                                                variant="moderate"
                                                size="small"
                                                color="warning"
                                            ></c-hot_tag>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <c-hot_tag
                                        label="Samtale er ikke opprettet"
                                        variant="moderate"
                                        size="small"
                                        color="warning"
                                    ></c-hot_tag>
                                </template>
                            </div>

                            <template lwc:if={hasTolkTLThread}>
                                <c-hot_messaging-thread-viewer
                                    thread={tolkTLThread}
                                    set-input-in-focus-on-render
                                    is-tjeneste-leverandor-formidler-view
                                ></c-hot_messaging-thread-viewer>
                            </template>
                            <template lwc:else>
                                <c-hot_messaging-thread-viewer-mock
                                    set-input-in-focus-on-render
                                    initial-message={tolkTLInitialMessage}
                                    data-user-thread-mock
                                    oncreatethreadwithmessage={handleCreateTolkTLThreadWithMessage}
                                ></c-hot_messaging-thread-viewer-mock>
                            </template>
                        </c-hot_expansion-card>
                    </div>

                    <div class="modal-footer">
                        <c-button
                            button-styling="primary"
                            button-label="Vis mer info"
                            aria-label="Vis mer informasjon om oppdraget"
                            title="Vis mer info om oppdraget"
                            onbuttonclick={handleViewMoreInfo}
                        ></c-button>
                    </div>
                </template>
            </div>
        </template>
    </dialog>

    <template lwc:if={dataLoader}>
        <div class="loader-container">
            <c-hot_loader size="3xlarge"></c-hot_loader>
        </div>
    </template>
</template>
