<template>
    <div class="page-background">
        <div class="tab-content-wrapper">
            <div class="list">
                <div class="header-row">
                    <h1 class="header-title">Tjenesteleverandør Oppdrag</h1>
                    <c-list-filters-button
                        header="Filtrer søket"
                        filters={filters}
                        onapplyfilter={applyFilter}
                        ongetfilteredrecordslength={sendFilteredRecordsLength}
                    ></c-list-filters-button>
                </div>

                <div class="tabset desktop-only" role="tablist">
                    <template for:each={tabMap} for:item="tab">
                        <button
                            key={tab.name}
                            class={tab.className}
                            data-id={tab.name}
                            onclick={setActiveTab}
                            role="tab"
                            aria-selected={tab.ariaSelected}
                            aria-controls={tab.ariaControls}
                            id={tab.ariaId}
                            aria-label={tab.ariaLabel}
                        >
                            {tab.label}
                        </button>
                    </template>
                </div>

                <div class="tabset picklist-service mobile">
                    <c-picklist choices={tabMap} onpicklistvaluechange={setActiveTabMobile}></c-picklist>
                </div>

                <template lwc:if={isTransferredTab}>
                    <div class="tab-content">
                        <c-hot_tjenesteleverandor-sa-transferred-list
                            record-id={recordId}
                            data-name="transferred"
                            onsendfilters={handleFilters}
                        ></c-hot_tjenesteleverandor-sa-transferred-list>
                    </div>
                </template>

                <template lwc:if={isAcceptedTab}>
                    <div class="tab-content">
                        <c-hot_tjenesteleverandor-sa-accepted-list
                            record-id={recordId}
                            data-name="accepted"
                            onsendfilters={handleFilters}
                        ></c-hot_tjenesteleverandor-sa-accepted-list>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
